<title>스케치 타운 월드 맵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 큰 지도(왼쪽) + 규칙 패널(오른쪽), 아래에 시드 갤러리. 좁으면 한 열. 지도 색은 데이터 색(고정), 화면 틀만 테마 토큰. */
:root{
  --bg:#eceff4;--surface:#fbfcfe;--fg:#1b1e2e;--muted:#59607a;--line:#d3d8e4;--accent:#4a4890;--accent-fg:#ffffff;--chip:#e3e7f1;
  --z0:#5fa35f;--z1:#c2ab2e;--z2:#e08a2e;--z3:#cc4a3a;--z4:#7a2a6e;
  --font-display:'Gaegu','Noto Sans KR',sans-serif;--font-body:'Noto Sans KR',system-ui,sans-serif;--font-data:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151e;--surface:#1b1e2a;--fg:#e5e8f3;--muted:#9aa1ba;--line:#2b3042;--accent:#aab0ff;--accent-fg:#13151e;--chip:#262a3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13151e;--surface:#1b1e2a;--fg:#e5e8f3;--muted:#9aa1ba;--line:#2b3042;--accent:#aab0ff;--accent-fg:#13151e;--chip:#262a3a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.55;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--font-display);font-size:2.3rem;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-size:1.6rem;margin:0 0 10px;text-wrap:balance}
p{margin:0}
.lede{color:var(--muted);max-width:68ch}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar label{display:flex;gap:6px;align-items:center;font-size:.9rem}
input[type=number]{width:9.5em;font:inherit;font-family:var(--font-data);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
button{font:inherit;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#b9d6e8}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:.8rem;max-width:230px;box-shadow:0 2px 10px rgba(0,0,0,.18);z-index:3}
.panel{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.live{font-family:var(--font-data);font-size:.85rem}
.live b{font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted)}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.i{display:inline-block;width:12px;height:12px}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:7px;font-size:.92rem}
.rules li{padding-left:2px}
.tag{font-size:.72rem;font-family:var(--font-data);background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:4px;margin-left:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.thumb{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;text-align:left;color:var(--fg);display:flex;flex-direction:column;gap:6px}
.thumb canvas{width:100%;aspect-ratio:1;display:block;border-radius:4px;background:#b9d6e8}
.thumb small{font-family:var(--font-data);color:var(--muted);font-size:.72rem}
.thumb[aria-current=true]{outline:2px solid var(--accent)}
</style>

<div class="wrap">
  <header>
    <h1>스케치 타운 월드 맵 프리뷰</h1>
    <p class="lede">해안(가장자리)에서 시작해 중앙 방향으로 갈수록 어려워지는 지도를 시드 하나로 생성합니다. 지도 위에 마우스를 올리면 그 자리에서 몹이 몇 마리 활성화되는지 보입니다. 둥지 위에 올리면 구성원을 보여줍니다.</p>
  </header>

  <div class="bar">
    <label for="seedInput">시드 <input id="seedInput" type="number" min="0" max="4294967295" step="1" value="7"></label>
    <button id="seedGo" type="button">생성</button>
    <button id="seedRandom" class="ghost" type="button">무작위 시드</button>
    <label for="optNests"><input id="optNests" type="checkbox" checked>몹 둥지</label>
    <label for="optProps"><input id="optProps" type="checkbox" checked>소품</label>
    <label for="optZones"><input id="optZones" type="checkbox" checked>구역선</label>
    <label for="optRing"><input id="optRing" type="checkbox" checked>활성 반경</label>
  </div>

  <div class="main">
    <div class="mapbox" id="mapBox" aria-label="생성된 월드 맵">
      <canvas id="baseCanvas"></canvas>
      <canvas id="overCanvas"></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="panel">
      <div class="card">
        <h2>지금 커서 위치</h2>
        <p class="live" id="live">지도 위에 커서를 올려 보세요.</p>
      </div>
      <div class="card">
        <h2>범례</h2>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </div>

  <section class="card">
    <h2>구역별 몹 <span class="tag">이 시드</span></h2>
    <div class="scroll"><table id="zoneTable"></table></div>
  </section>

  <section class="card">
    <h2>몹이 만들어지는 방식 <span class="tag">제안</span></h2>
    <ol class="rules" id="rules"></ol>
  </section>

  <section>
    <h2>시드 12개 비교</h2>
    <div class="gallery" id="gallery"></div>
  </section>
</div>

<!--SCRIPTS-->
<script>
(function(){
  // 몹 이름은 game_part2.js enemyDefs 와 같은 값입니다(프리뷰 표시용).
  const MOB_NAME={chaser:'종이 사냥꾼',spitter:'잉크 투척수',charger:'낙서 돌격수'};
  const NEST_NAME={wild:'야생 둥지',campGuard:'야영지 수호',portalGuard:'포털 수호',boss:'보스 둥지'};
  const ZONE_COLOR=['#5fa35f','#c2ab2e','#e08a2e','#cc4a3a','#7a2a6e'];
  const M=WORLD_MAP.mobs,Z=WORLD_MAP.zoneNames;
  const $=id=>document.getElementById(id);
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const BIOME_RGB=WORLD_MAP.biomes.map(b=>hex(b.color));
  const RIVER=hex('#5f9fc9'),CLIFF=hex('#6f6050'),ROAD=hex('#c9a46f');
  let layout=null,baseCanvas=$('baseCanvas'),overCanvas=$('overCanvas'),hoverNest=null;

  // 격자 → 이미지(구역선 포함)
  function gridImage(L,zoneLines){
    const g=L.grid,c=document.createElement('canvas');c.width=g.cols;c.height=g.rows;const x=c.getContext('2d'),img=x.createImageData(g.cols,g.rows);
    for(let j=0;j<g.rows;j++)for(let i=0;i<g.cols;i++){
      const k=g.index(i,j);let col=BIOME_RGB[g.land[k]?g.biome[k]:0];
      if(g.land[k]){
        if(g.road[k])col=ROAD;else if(g.wall[k]===WALL_RIVER)col=RIVER;else if(g.wall[k]===WALL_CLIFF)col=CLIFF;
        if(zoneLines&&((i+1<g.cols&&g.land[k+1]&&g.zone[k+1]!==g.zone[k])||(j+1<g.rows&&g.land[k+g.cols]&&g.zone[k+g.cols]!==g.zone[k])))col=[col[0]*.62,col[1]*.62,col[2]*.62];
      }
      const o=k*4;img.data[o]=col[0];img.data[o+1]=col[1];img.data[o+2]=col[2];img.data[o+3]=255;
    }
    x.putImageData(img,0,0);return c;
  }
  const star=(x,pt,r,n)=>{x.beginPath();for(let a=0;a<n*2;a++){const rr=a%2?r*.45:r,t=-Math.PI/2+a*Math.PI/n;x.lineTo(pt.x+rr*Math.cos(t),pt.y+rr*Math.sin(t));}x.closePath();};

  function drawScene(canvas,L,o){
    const css=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),size=Math.max(120,Math.round((css.width||240)*dpr));
    canvas.width=size;canvas.height=size;const x=canvas.getContext('2d'),k=size/L.size;
    x.imageSmoothingEnabled=true;x.drawImage(gridImage(L,o.zoneLines),0,0,size,size);
    if(o.props)for(const p of L.props){x.fillStyle=p.solid?'rgba(40,60,40,.55)':'rgba(40,60,40,.22)';x.beginPath();x.arc(p.x*k,p.y*k,Math.max(1,p.r*k*(o.big?.45:.4)),0,6.283);x.fill();}
    if(o.nests)for(const n of L.nests){
      const px=n.x*k,py=n.y*k,r=(o.big?1:.6)*(n.kind==='boss'?0:Math.max(3.5,3.5+n.members.length*.7))*dpr*(o.big?1.1:.8);
      x.fillStyle=ZONE_COLOR[n.zone];x.strokeStyle='#fff';x.lineWidth=1.3*dpr;
      if(n.kind==='wild'){x.beginPath();x.arc(px,py,r,0,6.283);x.fill();x.stroke();}
      else if(n.kind==='campGuard'){x.beginPath();x.rect(px-r,py-r,r*2,r*2);x.fill();x.strokeStyle='#222';x.stroke();}
      else if(n.kind==='portalGuard'){x.beginPath();x.moveTo(px,py-r*1.2);x.lineTo(px+r*1.2,py);x.lineTo(px,py+r*1.2);x.lineTo(px-r*1.2,py);x.closePath();x.fill();x.strokeStyle='#222';x.stroke();}
    }
    // 거점
    for(const s of L.sites){
      const px=s.x*k,py=s.y*k,u=(o.big?1:.7)*dpr;
      if(s.kind==='spawn'){x.fillStyle='#1d8a4a';x.strokeStyle='#fff';x.lineWidth=2*u;x.beginPath();x.arc(px,py,8*u,0,6.283);x.fill();x.stroke();
        if(o.big){x.fillStyle='#0f4a28';x.font=`700 ${12*dpr}px "Noto Sans KR",sans-serif`;x.textAlign=px>size*.9?'right':'left';x.fillText('시작',px+(px>size*.9?-11:11)*dpr,py+4*dpr);x.textAlign='left';}}
      else if(s.kind==='boss'){x.fillStyle='#d23a3a';x.strokeStyle='#fff';x.lineWidth=2*u;star(x,{x:px,y:py},(s.final?15:11)*u,5);x.fill();x.stroke();
        if(o.big){x.fillStyle='#5a1212';x.font=`700 ${12*dpr}px "Noto Sans KR",sans-serif`;x.fillText(s.final?'최종 보스':`보스 · ${Z[s.zone]}`,px+14*dpr,py+4*dpr);}}
      else if(s.kind==='camp'){x.strokeStyle='#b45a0a';x.lineWidth=2.4*u;x.beginPath();x.arc(px,py,s.r*k*.8,0,6.283);x.setLineDash([4*u,3*u]);x.stroke();x.setLineDash([]);
        if(o.big){x.fillStyle='#7a3a05';x.font=`500 ${11*dpr}px "Noto Sans KR",sans-serif`;x.fillText('야영지',px-14*dpr,py-s.r*k*.8-4*dpr);}}
      else if(s.kind==='portal'){x.strokeStyle='#7a3fc4';x.lineWidth=2.6*u;x.beginPath();x.arc(px,py,7*u,0,6.283);x.stroke();x.beginPath();x.arc(px,py,3*u,0,6.283);x.stroke();
        if(o.big){x.fillStyle='#4a2580';x.font=`500 ${11*dpr}px "Noto Sans KR",sans-serif`;x.fillText('포털',px+10*dpr,py+4*dpr);}}
    }
  }

  function renderMain(){
    const o={zoneLines:$('optZones').checked,props:$('optProps').checked,nests:$('optNests').checked,big:true};
    drawScene(baseCanvas,layout,o);drawOver(null);
  }
  function drawOver(cur){
    const size=baseCanvas.width,k=size/layout.size,dpr=size/(baseCanvas.getBoundingClientRect().width||size);
    overCanvas.width=size;overCanvas.height=size;const x=overCanvas.getContext('2d');
    if(hoverNest){x.strokeStyle='#222';x.lineWidth=1.6*dpr;x.setLineDash([5*dpr,4*dpr]);x.beginPath();x.arc(hoverNest.x*k,hoverNest.y*k,hoverNest.leash*k,0,6.283);x.stroke();x.setLineDash([]);}
    if(cur&&$('optRing').checked){
      const r=M.activeRadius*k;x.fillStyle='rgba(255,255,255,.16)';x.strokeStyle='rgba(20,20,40,.75)';x.lineWidth=2*dpr;x.beginPath();x.arc(cur.x*k,cur.y*k,r,0,6.283);x.fill();x.stroke();
      for(const n of layout.nests){const dx=n.x-cur.x,dy=n.y-cur.y;if(dx*dx+dy*dy<=M.activeRadius*M.activeRadius){x.strokeStyle='#fff';x.lineWidth=3*dpr;x.beginPath();x.arc(n.x*k,n.y*k,9*dpr,0,6.283);x.stroke();x.strokeStyle=ZONE_COLOR[n.zone];x.lineWidth=1.6*dpr;x.stroke();}}
    }
  }

  const mobText=members=>{const c={};members.forEach(m=>c[m]=(c[m]||0)+1);return Object.keys(c).map(m=>`${MOB_NAME[m]} ×${c[m]}`).join(', ');};

  function onMove(e){
    const r=baseCanvas.getBoundingClientRect(),wx=(e.clientX-r.left)/r.width*layout.size,wy=(e.clientY-r.top)/r.height*layout.size,cur={x:wx,y:wy};
    let near=null,nd=1e18;for(const n of layout.nests){const dx=n.x-wx,dy=n.y-wy,d=dx*dx+dy*dy;if(d<nd){nd=d;near=n;}}
    const pickR=26*layout.size/r.width;hoverNest=near&&nd<pickR*pickR?near:null;
    const z=layout.zoneAt(wx,wy),b=layout.biomeAt(wx,wy);let act=0,mobs=0;
    for(const n of layout.nests){const dx=n.x-wx,dy=n.y-wy;if(dx*dx+dy*dy<=M.activeRadius*M.activeRadius){act++;mobs+=n.members.length;}}
    const land=layout.grid.land[layout.grid.index(layout.grid.cellOf(wx,wy).i,layout.grid.cellOf(wx,wy).j)];
    $('live').innerHTML=land?`구역 <b>${Z[z]}</b> · 바이옴 <b>${b.name}</b><br>활성 반경 ${M.activeRadius}px 안: 둥지 <b>${act}</b>개 · 몹 <b>${mobs}</b>마리`:'바다입니다. 걸을 수 없습니다.';
    const tip=$('tip');
    if(hoverNest){const n=hoverNest;tip.hidden=false;tip.innerHTML=`<b>${NEST_NAME[n.kind]}</b> · ${Z[n.zone]}<br>${mobText(n.members)}<br>몹 체력 ×${n.hpScale.toFixed(2)} · 추격 한계 ${n.leash}px${n.kind==='boss'?'<br>보스 1 + 부하 '+n.members.length+' (재생성 없음)':''}`;
      const bx=e.clientX-r.left+14,by=e.clientY-r.top+14;tip.style.left=Math.min(bx,r.width-tip.offsetWidth-4)+'px';tip.style.top=Math.min(by,r.height-tip.offsetHeight-4)+'px';}
    else tip.hidden=true;
    drawOver(cur);
  }
  function onLeave(){hoverNest=null;$('tip').hidden=true;$('live').textContent='지도 위에 커서를 올려 보세요.';drawOver(null);}

  function tables(){
    const per=[0,0,0,0,0],cnt=[0,0,0,0,0];for(const n of layout.nests){per[n.zone]++;cnt[n.zone]+=n.members.length;}
    const biomeNames=z=>WORLD_MAP.zoneBiomes[z].map(id=>WORLD_MAP.biomes[id].name).join('·');
    const e=WORLD_MAP.zoneEdges;
    const rows=[0,1,2,3,4].map(z=>{const w=M.roster[z],t=w[0]+w[1]+w[2],pc=i=>Math.round(w[i]/t*100);
      return `<tr><td><span class="sw" style="background:${ZONE_COLOR[z]}"></span>${Z[z]}</td><td>${biomeNames(z)}</td><td>${pc(0)}/${pc(1)}/${pc(2)}</td><td>${M.group[z][0]}~${M.group[z][1]}</td><td>×${M.hpScale[z]}</td><td>×${M.damageScale[z]}</td><td>${per[z]}</td><td>${cnt[z]}</td></tr>`;}).join('');
    $('zoneTable').innerHTML=`<thead><tr><th>구역</th><th>바이옴</th><th title="종이 사냥꾼/잉크 투척수/낙서 돌격수 %">구성 %</th><th>둥지당</th><th>체력</th><th>피해</th><th>둥지</th><th>몹</th></tr></thead><tbody>${rows}</tbody>`;
  }
  function legend(){
    $('legend').innerHTML=[['<i class="i" style="background:#1d8a4a;border-radius:50%"></i>','시작 지점'],['<i class="i" style="background:#d23a3a;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)"></i>','보스'],
      ['<i class="i" style="border:2px dashed #b45a0a;border-radius:50%"></i>','야영지'],['<i class="i" style="border:2px solid #7a3fc4;border-radius:50%"></i>','포털'],
      ['<i class="i" style="background:#e08a2e;border-radius:50%"></i>','야생 둥지(색=구역)'],['<i class="i" style="background:#e08a2e;border:1px solid #222"></i>','야영지 수호'],['<i class="i" style="background:#e08a2e;border:1px solid #222;transform:rotate(45deg) scale(.8)"></i>','포털 수호'],
      ['<i class="i" style="background:#5f9fc9"></i>','강'],['<i class="i" style="background:#6f6050"></i>','절벽'],['<i class="i" style="background:#c9a46f"></i>','길(강 위는 다리)']].map(a=>`<span>${a[0]}${a[1]}</span>`).join('');
  }
  function rules(){
    $('rules').innerHTML=[
      `<b>둥지를 먼저 놓습니다.</b> 구역의 걸을 수 있는 면적 100만 px²당 ${M.nestPerMillionPx2.join(' / ')}개(해안 → 중심). 둥지끼리 ${M.nestGap}px, 시작 지점에서 ${M.safeRadius}px, 길에서 ${M.roadClearance}px 이상 떨어집니다.`,
      `<b>구성원은 시드에서 정합니다.</b> 둥지마다 몹 종류와 수를 만들 때 정하므로 같은 시드는 같은 몹을 만듭니다. 구성은 위 표의 비율, 수는 구역별 ${M.group.map(g=>g[0]+'~'+g[1]).join(' / ')}마리입니다.`,
      `<b>가까이 가면 생성합니다.</b> 어느 플레이어든 ${M.activeRadius}px 안으로 들어온 둥지만 실제 몹을 만듭니다. 화면 밖 몹을 계속 계산하지 않아 몹 수가 늘지 않습니다.`,
      `<b>몹은 둥지에 묶입니다.</b> 둥지에서 ${M.leash}px 넘게 쫓아오지 않고 돌아갑니다. 구역이 올라갈수록 체력 ×${M.hpScale[4]}, 피해 ×${M.damageScale[4]}까지 커집니다.`,
      `<b>다시 생깁니다.</b> 둥지의 몹이 모두 쓰러지고 모든 플레이어가 ${M.respawnAwayPx}px 밖에 ${M.respawnMs/1000}초 있으면 같은 구성으로 다시 생성합니다.`,
      `<b>야영지·포털은 수호 둥지가 지킵니다.</b> 구성원 +${M.elite.groupBonus}마리, 체력 ×${M.elite.hpScale}. 쓰러뜨렸을 때의 보상은 아직 정하지 않았습니다.`,
      `<b>보스 둥지는 보스 1마리 + 부하 ${M.bossMinions}마리입니다.</b> 보스는 다시 생기지 않습니다. 구역 순서대로 기존 보스 5종이 놓이고, 중앙 최종 보스는 빈 종이 거인입니다.`
    ].map(t=>`<li>${t}</li>`).join('');
  }

  function load(seed){
    $('seedInput').value=seed;const t=performance.now();layout=generateWorldMap(seed);layout.ms=Math.round(performance.now()-t);
    renderMain();tables();
    for(const b of document.querySelectorAll('.thumb'))b.setAttribute('aria-current',String(Number(b.dataset.seed)===seed));
  }
  $('seedGo').onclick=()=>{const v=Number($('seedInput').value);if(Number.isSafeInteger(v)&&v>=0&&v<=4294967295)load(v);};
  $('seedRandom').onclick=()=>load(Math.floor(Math.random()*1e6));
  for(const id of ['optNests','optProps','optZones'])$(id).onchange=renderMain;
  $('optRing').onchange=()=>drawOver(null);
  overCanvas.addEventListener('pointermove',onMove);overCanvas.addEventListener('pointerleave',onLeave);
  window.addEventListener('resize',()=>{if(layout)renderMain();});
  legend();rules();

  // 갤러리: 한 장씩 나눠서 그립니다(화면이 멈추지 않도록)
  const SEEDS=[7,21,38,64,101,256,333,512,777,1024,2048,4242];
  const gal=$('gallery'),cards=SEEDS.map(s=>{const b=document.createElement('button');b.type='button';b.className='thumb';b.dataset.seed=s;b.innerHTML=`<canvas></canvas><small>시드 ${s} · 생성 중…</small>`;b.onclick=()=>load(s);gal.append(b);return b;});
  load(7);
  let idx=0;(function next(){
    if(idx>=SEEDS.length)return;const s=SEEDS[idx],b=cards[idx++];
    setTimeout(()=>{const t=performance.now(),L=generateWorldMap(s),ms=Math.round(performance.now()-t),c=b.querySelector('canvas');
      drawScene(c,L,{zoneLines:true,props:false,nests:true,big:false});
      b.querySelector('small').textContent=`시드 ${s} · 둥지 ${L.nests.length} · 몹 ${L.report.mobsByZone.reduce((a,v)=>a+v,0)} · ${ms}ms`;next();},30);
  })();
})();
</script>
