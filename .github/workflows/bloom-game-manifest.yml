name: Verify bloom-game.json

on:
  pull_request:
    paths: [bloom-game.json, .github/workflows/bloom-game-manifest.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate against the BLOOM PLAYGROUND schema
        run: |
          curl -fsS https://raw.githubusercontent.com/byh-playground/bloom-world/main/playground/bloom-game.schema.json -o "$RUNNER_TEMP/schema.json"
          if jq -e 'has("nightly")' bloom-game.json >/dev/null; then
            echo "bloom-game.json must not contain nightly (generated by the Pages deploy)" >&2
            exit 1
          fi
          npx --yes ajv-cli@5 validate --spec=draft2020 -s "$RUNNER_TEMP/schema.json" -d bloom-game.json
