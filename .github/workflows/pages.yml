name: Validate and deploy original Pages source
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original source syntax and files
        run: |
          node --check source/bootstrap.js
          for file in source/gamekit_renderer.js source/gamekit_input.js source/gamekit_dom.js source/gamekit_audio.js source/vector-assets-compiled.js source/game_part*.js source/progression.js source/progression-ui.js source/region-map.js; do
            node --check "$file"
          done
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const boot=fs.readFileSync('source/bootstrap.js','utf8');
          if(!html.includes('src="./source/bootstrap.js"')||!html.includes('href="./source/styles.css"'))throw Error('HTML source entrypoint missing');
          for(const name of [...boot.matchAll(/'((?:source\/)[^']+\.js)'/g)].map(m=>m[1])){
            if(!fs.existsSync(name))throw Error('Missing native asset: '+name);
          }
          for(const path of ['source/cnn_weights.json','source/glyph_references.json','source/gamekit/simloop.js','source/gamekit/interpolation.js','source/assets/player.svg']) {
            if(!fs.existsSync(path))throw Error('Missing game asset: '+path);
          }
          NODE
          git diff --check
      - name: Stage original source files
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R source _site/source
          touch _site/.nojekyll
      - name: Publish bloom-game.json with the Nightly tag name
        run: |
          curl -fsS https://raw.githubusercontent.com/byh-playground/bloom-world/main/playground/bloom-game.schema.json -o "$RUNNER_TEMP/schema.json"
          STAMP=$(date -u -d "@$(git show -s --format=%ct "$GITHUB_SHA")" +%Y%m%dT%H%M%SZ)
          jq --arg t "nightly-$STAMP-${GITHUB_SHA:0:12}" '. + {nightly:$t}' bloom-game.json > _site/bloom-game.json
          npx --yes ajv-cli@5 validate --spec=draft2020 -s "$RUNNER_TEMP/schema.json" -d _site/bloom-game.json
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
